name: Build LineageOS Kernel for OnePlus Pad 2 Pro
on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "设备配置文件（仅用于命名后缀）"
        required: true
        default: oneplus_pad_2_pro_b
        options:
          - oneplus_pad_2_pro_b
      MANAGER_SOURCE:
        type: choice
        description: "管理器调用方向"
        required: true
        default: MD3
        options:
          - MD3
          - MD3_SPOOF
      SUSFS_CI:
        type: choice
        description: "SUSFS模块下载调用方向"
        required: true
        default: N/A
        options:
          - CI
          - Release
          - N/A
      KPM:
        type: choice
        description: "内核模块实现方式"
        required: true
        default: KPM
        options:
          - KPM
          - KPN
          - N/A
      SUSFS_META:
        type: string
        description: "回退SUSFS(输入哈希或次数或-1关闭)"
        required: false
        default: ""
      KSU_META:
        type: string
        description: "ReSukiSU分支名/自定义版本标识/回退提交哈希"
        required: false
        default: "main/Numbersf/"
      ZRAM:
        type: string
        description: "ZRAM(0关闭1开启)/算法名/大小"
        required: true
        default: "1/lz4kd/25769803776"
      SUFFIX:
        type: string
        description: "自定义内核后缀(不输入使用随机字符串)"
        required: false
        default: ""
      SUBLEVEL:
        type: string
        description: "自定义内核等级欺骗(SUBLEVEL)"
        required: false
        default: ""
      BUILD_TIME:
        type: string
        description: "自定义构建时间(输入F使用当前UTC时间)"
        required: false
        default: "Fri Dec 12 11:37:03 UTC 2025"
      FAST_BUILD:
        type: boolean
        description: "启用极速构建"
        required: true
        default: true
      LSM_BBG:
        type: boolean
        description: "启用BBG关键分区写入保护"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "启用网络功能拓展"
        required: true
        default: true
      CCM:
        type: boolean
        description: "启用BBR+ECN网络拥塞控制"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "修复Unicode不可见字码点漏洞"
        required: true
        default: false
      SCHED_HMBIRD:
        type: boolean
        description: "添加风驰驱动1.0"
        required: true
        default: false
      DROID_SPACES:
        type: boolean
        description: "添加DroidSpaces容器支持"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "添加Re-Kernel"
        required: true
        default: false
      SUSFS_DEV:
        type: boolean
        description: "使用SUSFS-DEV分支"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "停用空间清扫"
        required: true
        default: false
      BUILD_NOCCACHE:
        type: boolean
        description: "停用ccache"
        required: true
        default: false
      BUILD_TARGET:
        type: string
        description: "Bazel构建目标（备用）"
        required: false
        default: "kera_le"

jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ github.event.inputs.KPM == 'KPM' && ' [KPM]' || github.event.inputs.KPM == 'KPN' && ' [KPN]' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && ' [BBG]' || '' }}${{ github.event.inputs.SCHED_HMBIRD == 'true' && ' [HMBIRD]' || '' }}${{ github.event.inputs.DROID_SPACES == 'true' && ' [DS]' || '' }}${{ startsWith(github.event.inputs.ZRAM, '1/') && ' [ZRAM]' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && ' [REKER]' || '' }}${{ github.event.inputs.SUFFIX && format(' [{0}]', github.event.inputs.SUFFIX) || '' }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Environment & Variable Setup
        id: env_setup
        run: |
          echo "KERNEL_REPO=https://github.com/LineageOS/android_kernel_oneplus_sm8750.git" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=lineage-23.2" >> $GITHUB_ENV
          echo "FILE_BASE=$(echo '${{ github.event.inputs.FILE }}' | sed -E 's/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/')" >> $GITHUB_ENV
          # 设置CPU代号（必须！）
          echo "CPU=sm8750" >> $GITHUB_ENV
          # 解析ZRAM参数
          IFS='/' read -r Z_SW Z_ALGO Z_SIZE <<< "${{ github.event.inputs.ZRAM }}"
          echo "ZRAM_SWITCH=$Z_SW" >> $GITHUB_ENV
          echo "ZRAM_ALGO=$Z_ALGO" >> $GITHUB_ENV
          echo "ZRAM_SIZE=$Z_SIZE" >> $GITHUB_ENV
          echo "ZRAM_ALGO_U=${Z_ALGO^^}" >> $GITHUB_ENV
          # ReSukiSU 解析
          IFS='/' read -r KSU_BRANCH KSU_TAG KSU_HASH <<< "${{ github.event.inputs.KSU_META }}"
          echo "KSU_BRANCH=$KSU_BRANCH" >> $GITHUB_ENV
          echo "KSU_CUSTOM_TAG=$KSU_TAG" >> $GITHUB_ENV
          echo "KSU_MANUAL_HASH=$KSU_HASH" >> $GITHUB_ENV

      - name: Debug Inputs
        run: |
          echo "------------------------------"
          echo "内核仓库: ${{ env.KERNEL_REPO }}"
          echo "分支: ${{ env.KERNEL_BRANCH }}"
          echo "CPU: ${{ env.CPU }}"
          echo "FILE: ${{ github.event.inputs.FILE }}"
          echo "ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "KPM: ${{ github.event.inputs.KPM }}"
          echo "BBG: ${{ github.event.inputs.LSM_BBG }}"
          echo "风驰: ${{ github.event.inputs.SCHED_HMBIRD }}"
          echo "DroidSpaces: ${{ github.event.inputs.DROID_SPACES }}"
          echo "Re-Kernel: ${{ github.event.inputs.RE_KERNEL }}"
          echo "SUSFS: ${{ github.event.inputs.SUSFS_META }}"
          echo "FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "------------------------------"

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install Dependencies + APTC
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils
          execute_install_scripts: true

      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.2

      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          fi
          ccache -s

      - name: Clone LineageOS Kernel Source
        run: |
          set -e
          echo "📦 克隆内核: ${{ env.KERNEL_REPO }} (分支: ${{ env.KERNEL_BRANCH }})"
          mkdir -p kernel_workspace/kernel_platform/common
          git clone --depth=1 --branch "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_REPO }}" kernel_workspace/kernel_platform/common
          cd kernel_workspace/kernel_platform/common
          echo "✅ 源码已就绪，当前目录:"
          ls -la

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          echo "原始内核版本: $ORIG_VERSION"

          SUBLEVEL_INPUT="${{ github.event.inputs.SUBLEVEL }}"
          if [ -n "$SUBLEVEL_INPUT" ]; then
            echo "修改 SUBLEVEL 为 $SUBLEVEL_INPUT"
            sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVEL_INPUT/" ./common/Makefile
          fi

          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          echo "当前内核版本: $NEW_VERSION"
          echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2)" >> $GITHUB_ENV
          echo "KERNEL_SHORT_PATCH_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV

          # Android 版本识别
          if [ -f ./common/build.config.constants ]; then
            ANDROID_VER=$(grep '^BRANCH=' ./common/build.config.constants | cut -d'=' -f2)
            if [ -n "$ANDROID_VER" ]; then
              echo "KANDROID_VERSION=${ANDROID_VER%-*}" >> $GITHUB_ENV
            else
              echo "KANDROID_VERSION=android15-6.6" >> $GITHUB_ENV
            fi
          else
            echo "KANDROID_VERSION=android15-6.6" >> $GITHUB_ENV
          fi
          # 供 Unicode 补丁判断
          echo "KV1=$(echo $NEW_VERSION | cut -d. -f1)" >> $GITHUB_ENV

      - name: Custom Kernel Suffix or Random
        run: |
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          if [ -z "$SUFFIX" ]; then
            RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
            RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
            SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"
          fi
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          for path in kernel_platform/common/scripts/setlocalversion; do
            [ -f "$path" ] || continue
            echo "修改后缀: $path"
            sed -i 's/ -dirty//g' "$path"
            if grep -q 'echo "\$res"' "$path"; then
              if [ "$FAST_BUILD" = "true" ]; then
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$path"
              else
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "echo \"\$res-${KANDROID_VERSION}-${SUFFIX}\"" >> "$path"
            fi
          done
          git add -A && git commit -m "Custom suffix: ${SUFFIX}" || true

      # 克隆所需的附加仓库
      - name: Clone Helper Repos (SukiSU_patch, Action-Build, Re-Kernel)
        run: |
          cd kernel_workspace
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          git clone https://github.com/Numbersf/Action-Build.git
          if [ "${{ github.event.inputs.RE_KERNEL }}" == "true" ]; then
            git clone https://github.com/Sakion-Team/Re-Kernel.git
          fi

      - name: Add ReSukiSU & SUSFS
        run: |
          cd kernel_workspace/kernel_platform
          KSU_BRANCH="${{ env.KSU_BRANCH }}"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$KSU_BRANCH"
          cd KernelSU
          if [ -n "${{ env.KSU_CUSTOM_TAG }}" ]; then
            echo "KSU_CUSTOM_TAG=${{ env.KSU_CUSTOM_TAG }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ env.KSU_MANUAL_HASH }}" ]; then
            git fetch origin "$KSU_BRANCH" --depth=50
            git checkout "${{ env.KSU_MANUAL_HASH }}"
          fi
          KSU_VERSION=$(expr $(git rev-list --count main 2>/dev/null || echo 13000) + 30700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          cd ..

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{ github.event.inputs.SUSFS_DEV == 'true' && '-dev' || '' }}
            cd susfs4ksu
            if [ -n "${{ github.event.inputs.SUSFS_META }}" ]; then
              if [[ "${{ github.event.inputs.SUSFS_META }}" =~ ^[0-9]+$ ]]; then
                git checkout HEAD~${{ github.event.inputs.SUSFS_META }}
              else
                git checkout "${{ github.event.inputs.SUSFS_META }}"
              fi
            fi
            cd ..
            cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-*.patch kernel_platform/common/
            cp -r susfs4ksu/kernel_patches/fs/* kernel_platform/common/fs/
            cp -r susfs4ksu/kernel_patches/include/linux/* kernel_platform/common/include/linux/
            cd kernel_platform/common
            echo "应用 SUSFS 补丁..."
            patch -p1 < 50_add_susfs_in_gki-*.patch || true
            cd ../..
          fi

      - name: Apply SUSFS Patch and Fixes
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace/kernel_platform/common
          GKI_V="${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')

          if [ "$GKI_V" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "修复旧版 C 库 bug"
            cp ../../Action-Build/patches/fix_5.15.legacy ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
          fi

          KV2=$(echo "${{ env.KERNEL_VERSION }}" | tr -d '.')
          KV3=$(echo "${{ env.TKERNEL_VERSION }}" | tr -d '.')
          if [[ "$KV2" == "66" && "$KV3" -le 6630 ]]; then
            echo "修复缺失 trusty 问题"
            sed -i 's/-32,12 +32,38/-32,11 +32,37/g' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            sed -i '/#include <trace\/hooks\/fs.h>/d' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
          fi

          fake_patched=0
          if [ "$GKI_V" = "android15-6.6" ]; then
            if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t *res = NULL;' ./fs/proc/task_mmu.c
              fake_patched=1
            fi
            if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
              sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
            fi
          fi
          if [ "$GKI_V" = "android14-6.1" ]; then
            if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
              fake_patched=1
            fi
            if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
              sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
            fi
          fi
          if [ "$GKI_V" = "android12-5.10" ] || [ "$GKI_V" = "android13-5.15" ]; then
            if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
              fake_patched=1
            fi
          fi

          echo "正在打 susfs 补丁"
          patch -p1 < 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
          echo "susfs_patch 完成"

          if [ "$fake_patched" = 1 ]; then
            if [ "$GKI_V" = "android15-6.6" ]; then
              if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                sed -i -e '/unsigned int nr_subpages = __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
              fi
            fi
            if [ "$GKI_V" = "android12-5.10" ] || [ "$GKI_V" = "android13-5.15" ] || [ "$GKI_V" = "android14-6.1" ]; then
              if grep -q 'goto[[:space:]]\+show_pad;' ./fs/proc/task_mmu.c; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
            fi
          fi

      - name: Apply ZRAM
        if: startsWith(github.event.inputs.ZRAM, '1/')
        run: |
          ZRAM="${{ github.event.inputs.ZRAM }}"
          IFS='/' read -r ZRAM_SWSTA ZRAM_ALGO ZRAM_SIZE <<< "$ZRAM"
          echo "ZRAM_ALGO=$ZRAM_ALGO" >> $GITHUB_ENV
          echo "ZRAM_SIZE=$ZRAM_SIZE" >> $GITHUB_ENV
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform/common
          echo "正在打 lz4kd 补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4kd.patch" || true
          echo "正在打 lz4k_oplus 补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4k_oplus.patch" || true

      - name: Apply SCHED_HMBIRD
        if: ${{ github.event.inputs.SCHED_HMBIRD == 'true' }}
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          cd kernel_workspace/kernel_platform/common
          CLEAN_FILE="${FILE//_bak/}"
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && { echo "风驰代码已存在，跳过"; exit 0; }
          done
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b ${{ env.CPU }} || { echo "❌ CPU 分支不存在，请关闭风驰选项"; exit 11; }
          cp ./SCHED_PATCH/fengchi_${CLEAN_FILE}.patch ./
          if [[ -f "fengchi_${CLEAN_FILE}.patch" ]]; then
            dos2unix "fengchi_${CLEAN_FILE}.patch"
            patch -p1 -F 3 < "fengchi_${CLEAN_FILE}.patch"
            echo "fengchi_patch 完成"
          else
            echo "❌ 未找到风驰补丁文件"; exit 12
          fi

      - name: Apply BBG
        if: ${{ github.event.inputs.LSM_BBG == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig

      - name: Apply DROID_SPACES
        if: ${{ github.event.inputs.DROID_SPACES == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          sed -i 's/struct sysv_sem\s*sysvsem;/\/\/ struct sysv_sem\t\t\tsysvsem;/g' include/linux/sched.h
          sed -i 's/struct sysv_shm\s*sysvshm;/\/\/ struct sysv_shm\t\t\tsysvshm;/g' include/linux/sched.h

          if grep -q "sched_dl_entity.*\*dl_server" include/linux/sched.h; then
            echo "✅ dl_server 指针方案"
            sed -i 's|\tstruct sched_entity\t\tse;|#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n\n\tstruct sched_entity\t\tse;|' include/linux/sched.h
          elif grep -q "ANDROID_KABI_USE(1," include/linux/sched.h; then
            echo "✅ USE(1) 方案"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(1);" include/linux/sched.h; then
            echo "✅ RESERVE(1) 方案"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(3);" include/linux/sched.h; then
            echo "✅ fallback 方案"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif\n\tANDROID_KABI_RESERVE(6);|;}' include/linux/sched.h
          else
            echo "❌ 无法匹配 KABI 槽位"; exit 1
          fi

      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          RE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source"
          cd kernel_workspace/kernel_platform/common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          cp ${RE_DIR}/rekernel.c ${RE_DIR}/rekernel.h ${RE_DIR}/Makefile ${RE_DIR}/Kconfig drivers/rekernel/
          sed -i "s|^\s*//\s*#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|\#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|" drivers/rekernel/rekernel.h

      - name: Apply UNICODE_BYPASS
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [ "${{ env.KV1 }}" -lt 6 ]; then
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || true
          fi

      - name: Add Kernel Configurations
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE="./arch/arm64/configs/gki_defconfig"
          if [ ! -f "$CONFIG_FILE" ]; then
            CONFIG_FILE="./arch/arm64/configs/defconfig"
          fi
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_TOOLKIT_SUPPORT=y" >> "$CONFIG_FILE"
          if [ -n "$KSU_CUSTOM_TAG" ]; then
            echo "CONFIG_KSU_FULL_NAME_FORMAT=\"%TAG_NAME%-${KSU_CUSTOM_TAG}@${KSU_BRANCH}[%COMMIT_SHA%]\"" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.KPM }}" == "KPM" ] || [ "${{ github.event.inputs.KPM }}" == "N/A" ]; then
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          elif [ "${{ github.event.inputs.KPM }}" == "KPN" ]; then
            echo "CONFIG_KPM=n" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$CONFIG_FILE"
          fi

          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"

          if [ "${{ github.event.inputs.CCM }}" == "true" ]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_BBR=y" >> "$CONFIG_FILE"
            echo "CONFIG_NET_SCH_FQ=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_ECN=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_ECN=y" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.RE_KERNEL }}" == "true" ]; then
            echo "CONFIG_REKERNEL=y" >> "$CONFIG_FILE"
            echo "CONFIG_REKERNEL_NETWORK=y" >> "$CONFIG_FILE"
          fi

          if [[ "${{ env.ZRAM_SWITCH }}" == "1" ]]; then
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.LSM_BBG }}" == "true" ]; then
            echo "CONFIG_BBG=y" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.DROID_SPACES }}" == "true" ]; then
            echo "CONFIG_SYSVIPC=y" >> "$CONFIG_FILE"
            echo "CONFIG_DEVTMPFS=y" >> "$CONFIG_FILE"
            echo "CONFIG_PID_NS=y" >> "$CONFIG_FILE"
            echo "CONFIG_POSIX_MQUEUE=y" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.NETFILTER }}" == "true" ]; then
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$CONFIG_FILE"
            echo "CONFIG_NETFILTER_XT_SET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_MAX=65534" >> "$CONFIG_FILE"
          fi

          if [ -f build.config.constants ]; then
            RUSTC_VERSION=$(grep '^RUSTC_VERSION=' build.config.constants | cut -d'=' -f2)
            if [ -n "$RUSTC_VERSION" ]; then
              echo "CONFIG_RUST=y" >> "$CONFIG_FILE"
              echo "CONFIG_ANDROID_BINDER_IPC_RUST=m" >> "$CONFIG_FILE"
            fi
          fi

          sed -i 's/check_defconfig//' ./build.config.gki 2>/dev/null || true

      - name: Build Kernel (Fast Mode)
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          cd kernel_workspace/kernel_platform
          CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common 2>/dev/null | cut -d'=' -f2 || true)
          if [ -z "$CLANG_PREBUILT_BIN" ]; then
            echo "fallback=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$CLANG_PREBUILT_BIN" =~ (clang-r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [ -z "$CLANG_VERSION" ]; then
            echo "fallback=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          cd ./common
          if [ -f arch/arm64/configs/gki_defconfig ]; then
            DEFCONFIG="gki_defconfig"
          else
            DEFCONFIG="defconfig"
          fi
          MAKE_ARGS=(LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" HOSTCC="ccache clang" LD=ld.lld HOSTLD=ld.lld)
          make O=out "${MAKE_ARGS[@]}" $DEFCONFIG
          make O=out "${MAKE_ARGS[@]}" olddefconfig
          make -j$(nproc) O=out "${MAKE_ARGS[@]}"
          ccache -s

      - name: Build Kernel (Fallback - Bazel)
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform
          if [ -f build_with_bazel.py ]; then
            TARGET="${{ github.event.inputs.BUILD_TARGET }}"
            python3 build_with_bazel.py -t "$TARGET" userdebug
          elif [ -f build.sh ]; then
            chmod +x build.sh
            ./build.sh
          else
            echo "❌ 未找到有效构建脚本"
            exit 1
          fi

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find
          IMAGE=$(find ./kernel_workspace -type f -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then
            echo "❌ 未找到 Image 文件"
            exit 1
          fi
          cp "$IMAGE" ./AnyKernel3/Image
          cp "$IMAGE" kernel_workspace/kernel_platform/out/Final-Image-Find/Image

      - name: Apply KPX and Replace Image
        if: ${{ github.event.inputs.KPM != 'N/A' }}
        run: |
          KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
          KPN_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpn"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
          cd "${OUT_DIR}"
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ]; then
            cp "${KPM_DIR}/patch_linux" .
            chmod +x patch_linux
            ./patch_linux
          else
            cp "${KPN_DIR}/kptools-linux" "${KPN_DIR}/kpimg-linux" .
            chmod +x ./kptools-linux
            ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          fi
          mv -f oImage Image 2>/dev/null || true
          cp Image "${GITHUB_WORKSPACE}/AnyKernel3/Image"

      - name: Resolve Manager Source
        id: manager
        run: |
          case "${{ github.event.inputs.MANAGER_SOURCE }}" in
            MD3_SPOOF)
              echo "manager_branch=main" >> $GITHUB_OUTPUT
              echo "manager_artifact=Spoofed-Manager-release" >> $GITHUB_OUTPUT
              ;;
            MD3|*)
              echo "manager_branch=main" >> $GITHUB_OUTPUT
              echo "manager_artifact=Manager-release" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -n "$LATEST_RUN_ID" ]; then
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$ARTIFACT_URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            fi
          fi

      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          wget -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: Download Latest ReSukiSU APK from CI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANAGER_BRANCH="${{ steps.manager.outputs.manager_branch }}"
          MANAGER_ARTIFACT="${{ steps.manager.outputs.manager_artifact }}"

          run_id=$(gh api "repos/ReSukiSU/ReSukiSU/actions/workflows/build-manager.yml/runs?branch=$MANAGER_BRANCH&status=success&per_page=1" --jq '.workflow_runs[0].id' || echo "")
          if [ -n "$run_id" ]; then
            artifact_url=$(gh api "repos/ReSukiSU/ReSukiSU/actions/runs/$run_id/artifacts" | jq -r ".artifacts[] | select(.name == \"$MANAGER_ARTIFACT\") | .archive_download_url" | head -n1)
            if [ -n "$artifact_url" ]; then
              curl -fL -H "Authorization: token $GITHUB_TOKEN" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url"
              if unzip -l "${MANAGER_ARTIFACT}.zip" | grep -q "arm64-v8a.*\.apk"; then
                unzip -j "${MANAGER_ARTIFACT}.zip" "*arm64-v8a*.apk" -d ./AnyKernel3/
              else
                unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d ./AnyKernel3/
              fi
            fi
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v7
        with:
          name: ReSukiSU-${{ env.KSUVER }}_${{ env.FILE_BASE }}_${{ env.TKERNEL_VERSION }}${{ github.event.inputs.SUFFIX && format('_{0}', github.event.inputs.SUFFIX) || '' }}
          path: ./AnyKernel3/*

      - name: Post-build Disk Check
        run: df -h
